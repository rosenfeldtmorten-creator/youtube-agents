name: Publish

# Renders the next queued video for each channel and uploads it to YouTube.
# The daily schedule only runs once the repository variable AUTOPUBLISH is set to "true".
# It publishes the channels listed in the variable ACTIVE_CHANNELS, e.g. ["english-stories","money-charts"].
# Run it by hand from the Actions tab: leave "upload" unticked to get a test video you can download.

on:
  schedule:
    - cron: "0 14 * * *"   # 14:00 UTC every day; pacing rules in channel.yaml decide if anything is due
  workflow_dispatch:
    inputs:
      channel:
        description: Channel (its folder name under channels/)
        type: string
        default: money-charts
      upload:
        description: Upload to YouTube (untick for a test render you can download)
        type: boolean
        default: false
      force:
        description: Upload even if the weekly pacing says it's too soon (manual runs only)
        type: boolean
        default: false
      voice:
        description: Voice
        type: choice
        options: [chatterbox, espeak, silent]
        default: chatterbox

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name != 'schedule' || vars.AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || vars.ACTIVE_CHANNELS || '["money-charts"]') }}
    env:
      PYTHONUNBUFFERED: "1"   # show render progress live in the Actions log
      RESEMBLE_ENHANCE: /tmp/re/bin/resemble-enhance
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
      VOICE: ${{ inputs.voice || 'chatterbox' }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space   # the voice models, two copies of torch and full-HD frames don't fit in a stock runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true
          echo "::notice title=Disk before::$(df -h / | tail -1)"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core espeak-ng r-base-core r-cran-ggplot2 r-cran-jsonlite r-cran-scales

      - name: Cache voice model
        if: env.VOICE == 'chatterbox'
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-0.1.7

      - name: Restore narration cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/voice
          key: narration-${{ matrix.channel }}-${{ github.run_id }}
          restore-keys: narration-${{ matrix.channel }}-

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          if [ "$VOICE" = "chatterbox" ]; then
            pip install -r requirements-voice.txt --extra-index-url https://download.pytorch.org/whl/cpu
          fi

      - name: Install the voice restoration model
        if: env.VOICE == 'chatterbox'
        continue-on-error: true   # without it the video still renders, with the plain cloned voice
        run: |
          python -m venv /tmp/re
          /tmp/re/bin/pip install -q resemble-enhance --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Narrate (saved before rendering, so a failed render keeps the voice work)
        if: env.VOICE == 'chatterbox'
        run: python -m yta narrate --channel "${{ matrix.channel }}" --voice chatterbox

      - name: Save narration
        if: always() && env.VOICE == 'chatterbox'
        uses: actions/cache/save@v4
        with:
          path: .cache/voice
          key: narration-${{ matrix.channel }}-${{ github.run_id }}-narrated

      - name: Drop the restoration model before rendering
        if: always() && env.VOICE == 'chatterbox'
        run: |
          rm -rf /tmp/re   # keep ~/.cache/pip: setup-python saves it after the job
          echo "::notice title=Disk before render::$(df -h / | tail -1)"

      - name: Render and publish
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          YT_SECRETS: ${{ toJSON(secrets) }}   # each channel's login is the secret its channel.yaml names
        shell: bash
        run: |
          set -o pipefail
          {
          if [ "$UPLOAD" = "true" ]; then
            python -m yta run --channel "${{ matrix.channel }}" --voice "$VOICE" ${{ inputs.force && '--force' || '' }}
          else
            python -m yta run --channel "${{ matrix.channel }}" --voice "$VOICE" --no-upload --force
          fi
          } 2>&1 | tee run.log

      - name: Report the error
        if: failure()
        shell: bash
        run: |
          # Annotations can be read through the API, so the agent can see why a run failed.
          msg=$(tail -c 3500 run.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r//g; s/\n/%0A/g')
          echo "::error title=Publish failed::${msg}"

      - name: Save narration cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/voice
          key: narration-${{ matrix.channel }}-${{ github.run_id }}

      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: video-${{ matrix.channel }}
          path: |
            out/**/video.mp4
            out/**/thumbnail.jpg
          retention-days: 7

      - name: Record what was published
        if: env.UPLOAD == 'true'
        run: |
          git config user.name "youtube-agents"
          git config user.email "actions@users.noreply.github.com"
          git add channels
          if ! git diff --cached --quiet; then
            git commit -m "Publish ${{ matrix.channel }} $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
