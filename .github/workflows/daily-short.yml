name: Daily Short

# Posts one Short a day on each active chart channel (ACTIVE_CHANNELS), cut from a video that is already up (newest video first), linking back to it.
# A day when a video went up with its own Short is skipped. Like Publish, the schedule only runs once
# the repository variable AUTOPUBLISH is "true"; run it by hand with "upload" unticked for a test render.
on:
  schedule:
    - cron: "0 17 * * *"   # 17:00 UTC, after the 14:00 publish run
  workflow_dispatch:
    inputs:
      channel:
        description: Channel (its folder name under channels/)
        type: string
        default: money-charts
      upload:
        description: Upload to YouTube (untick for a test render you can download)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish   # never at the same time as a video upload, so their records don't clash
  cancel-in-progress: false

jobs:
  channels:
    if: github.event_name != 'schedule' || vars.AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ACTIVE: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || vars.ACTIVE_CHANNELS || '["money-charts"]' }}
        run: |
          python3 -m pip install -q pyyaml
          echo "list=$(python3 -m yta channels --active "$ACTIVE" --format episode)" >> "$GITHUB_OUTPUT"

  short:
    needs: channels
    if: needs.channels.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.channels.outputs.list) }}
    env:
      PYTHONUNBUFFERED: "1"
      RESEMBLE_ENHANCE: /tmp/re/bin/resemble-enhance
      CHANNEL: ${{ matrix.channel }}
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core r-base-core r-cran-ggplot2 r-cran-jsonlite r-cran-scales

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-0.1.7

      - name: Restore narration cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/voice
          key: narration-${{ env.CHANNEL }}-${{ github.run_id }}
          restore-keys: narration-${{ env.CHANNEL }}-

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install -r requirements-voice.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install the voice restoration model
        continue-on-error: true
        run: |
          python -m venv /tmp/re
          /tmp/re/bin/pip install -q resemble-enhance --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Find the channel's login secrets
        id: login
        run: python -m yta secret-names --channel "$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Make and post the Short
        env:
          YT_REFRESH_TOKEN: ${{ secrets[steps.login.outputs.refresh_token] }}   # only this channel's login, named in its channel.yaml
          YT_CLIENT_ID: ${{ secrets[steps.login.outputs.client_id] }}
          YT_CLIENT_SECRET: ${{ secrets[steps.login.outputs.client_secret] }}
        shell: bash
        run: |
          set -o pipefail
          if [ "$UPLOAD" = "true" ]; then
            python -m yta short --channel "$CHANNEL" --voice chatterbox 2>&1 | tee run.log
          else
            python -m yta short --channel "$CHANNEL" --voice chatterbox --no-upload --force 2>&1 | tee run.log
          fi

      - name: Report the error
        if: failure()
        shell: bash
        run: |
          msg=$(tail -c 3500 run.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r//g; s/\n/%0A/g')
          echo "::error title=Daily Short failed::${msg}"

      - name: Save narration cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/voice
          key: narration-${{ env.CHANNEL }}-${{ github.run_id }}

      - name: Keep the Short
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: short-${{ matrix.channel }}
          path: out/**/short-*/video.mp4
          retention-days: 7

      - name: Share the test render   # artifacts can't be fetched from the agent's sandbox, a branch can
        if: env.UPLOAD != 'true'
        run: |
          src=$(ls -t out/*/*/short-*/video.mp4 | head -1)
          git config user.name "youtube-agents"
          git config user.email "actions@users.noreply.github.com"
          git checkout --orphan short-preview
          git rm -rq --cached .
          mkdir -p preview && cp "$src" preview/short.mp4 && echo "$src" > preview/source.txt
          git add -f preview
          git commit -qm "Short test render $(date -u +%F)"
          git push -f origin HEAD:short-preview

      - name: Record what was posted
        if: env.UPLOAD == 'true'
        run: |
          git config user.name "youtube-agents"
          git config user.email "actions@users.noreply.github.com"
          git add channels
          if ! git diff --cached --quiet; then
            git commit -m "Short ${CHANNEL} $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
