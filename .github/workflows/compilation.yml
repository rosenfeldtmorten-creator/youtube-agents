name: Weekly compilation

# Joins the Shorts a clips channel (format: clips, e.g. Nature Unleashed) has published since its last compilation
# into one 6-10 minute landscape video, and uploads it. It skips a week when there aren't enough new Shorts yet
# (channel.yaml "compilation" settings). Like Publish, the schedule only runs once AUTOPUBLISH is "true";
# run it by hand with "upload" unticked for a test render you can download.
on:
  schedule:
    - cron: "0 15 * * 0"   # Sundays 15:00 UTC
  workflow_dispatch:
    inputs:
      channel:
        description: Channel (its folder name under channels/)
        type: string
        default: nature-unleashed
      upload:
        description: Upload to YouTube (untick for a test render you can download)
        type: boolean
        default: false
      force:
        description: Make one even if it isn't due (test renders use the latest Shorts)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish   # never at the same time as another upload, so their records don't clash
  cancel-in-progress: false

jobs:
  channels:
    if: github.event_name != 'schedule' || vars.AUTOPUBLISH == 'true'
    runs-on: ubuntu-latest
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
      - id: pick
        env:
          ACTIVE: ${{ github.event_name == 'workflow_dispatch' && format('["{0}"]', inputs.channel) || vars.ACTIVE_CHANNELS || '[]' }}
        run: |
          python3 -m pip install -q pyyaml
          echo "list=$(python3 -m yta channels --active "$ACTIVE" --format clips)" >> "$GITHUB_OUTPUT"

  compile:
    needs: channels
    if: needs.channels.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        channel: ${{ fromJSON(needs.channels.outputs.list) }}
    env:
      PYTHONUNBUFFERED: "1"
      RESEMBLE_ENHANCE: /tmp/re/bin/resemble-enhance
      UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload }}
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg fonts-dejavu-core espeak-ng

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-0.1.7

      - name: Restore narration cache   # the Shorts' sentences are already spoken; only the intro and outro are new
        uses: actions/cache/restore@v4
        with:
          path: .cache/voice
          key: narration-${{ matrix.channel }}-${{ github.run_id }}
          restore-keys: narration-${{ matrix.channel }}-

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install -r requirements-voice.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install the voice restoration model
        continue-on-error: true
        run: |
          python -m venv /tmp/re
          /tmp/re/bin/pip install -q resemble-enhance --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Find the channel's login secrets
        id: login
        run: python -m yta secret-names --channel "${{ matrix.channel }}" >> "$GITHUB_OUTPUT"

      - name: Render and upload
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YT_REFRESH_TOKEN: ${{ secrets[steps.login.outputs.refresh_token] }}   # only this channel's login, named in its channel.yaml
          YT_CLIENT_ID: ${{ secrets[steps.login.outputs.client_id] }}
          YT_CLIENT_SECRET: ${{ secrets[steps.login.outputs.client_secret] }}
        shell: bash
        run: |
          set -o pipefail
          flags=""
          [ "$UPLOAD" = "true" ] || flags="--no-upload"
          [ "${{ inputs.force }}" = "true" ] && flags="$flags --force"
          python -m yta compile --channel "${{ matrix.channel }}" --voice chatterbox $flags 2>&1 | tee run.log

      - name: Report the error
        if: failure()
        shell: bash
        run: |
          msg=$(tail -c 3500 run.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g; s/\r//g; s/\n/%0A/g')
          echo "::error title=Compilation failed::${msg}"

      - name: Save narration cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/voice
          key: narration-${{ matrix.channel }}-${{ github.run_id }}

      - name: Keep the video
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-${{ matrix.channel }}
          path: |
            out/**/video.mp4
            out/**/thumbnail.jpg
            out/**/description.txt
          retention-days: 7

      - name: Record what was published
        if: env.UPLOAD == 'true'
        run: |
          git config user.name "youtube-agents"
          git config user.email "actions@users.noreply.github.com"
          git add channels
          if ! git diff --cached --quiet; then
            git commit -m "Compilation ${{ matrix.channel }} $(date -u +%F)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
