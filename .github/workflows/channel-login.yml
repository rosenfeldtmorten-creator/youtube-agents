name: Channel login

# Shows which YouTube channel a channel's login uploads to. Run it after adding a new refresh token,
# before the first upload, to be sure videos land on the right channel.
on:
  workflow_dispatch:
    inputs:
      channel:
        description: Channel (its folder name under channels/)
        type: string
        default: money-charts

permissions:
  contents: read

jobs:
  whoami:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Find the channel's login secrets
        id: login
        env:
          CHANNEL: ${{ inputs.channel }}
        run: python -m yta secret-names --channel "$CHANNEL" >> "$GITHUB_OUTPUT"

      - name: Log in as the channel
        env:
          CHANNEL: ${{ inputs.channel }}
          YT_REFRESH_TOKEN: ${{ secrets[steps.login.outputs.refresh_token] }}   # only this channel's login, named in its channel.yaml
          YT_CLIENT_ID: ${{ secrets[steps.login.outputs.client_id] }}
          YT_CLIENT_SECRET: ${{ secrets[steps.login.outputs.client_secret] }}
        run: python -m yta whoami --channel "$CHANNEL"
