name: Prepare voices

# Speaks and restores the narration of the next queued episodes ahead of time and saves it in the
# narration cache, so an upload day only has to render (minutes instead of hours).
on:
  schedule:
    - cron: "0 2 * * *"   # nightly; episodes already in the cache are skipped in seconds
  workflow_dispatch:
    inputs:
      episodes:
        description: How many queued episodes to prepare
        default: "2"

permissions:
  contents: read

concurrency:
  group: prepare-voices
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      PYTHONUNBUFFERED: "1"
      RESEMBLE_ENHANCE: /tmp/re/bin/resemble-enhance
      CHANNEL: money-charts
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af > /dev/null || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install system tools
        run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg

      - name: Cache voice model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-chatterbox-0.1.7

      - name: Restore narration cache
        uses: actions/cache/restore@v4
        with:
          path: .cache/voice
          key: narration-${{ env.CHANNEL }}-${{ github.run_id }}
          restore-keys: narration-${{ env.CHANNEL }}-

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          pip install -r requirements-voice.txt --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Install the voice restoration model
        continue-on-error: true
        run: |
          python -m venv /tmp/re
          /tmp/re/bin/pip install -q resemble-enhance --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Narrate the next episodes
        run: python -m yta narrate --channel "$CHANNEL" --voice chatterbox --episodes "${{ inputs.episodes || '2' }}"

      - name: Save narration
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .cache/voice
          key: narration-${{ env.CHANNEL }}-${{ github.run_id }}-prepared
