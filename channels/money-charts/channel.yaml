# Economics in Charts: finance explainers built on public data. Every number is computed, never typed.
name: Economics in Charts
slug: money-charts
format: episode
thumbnail_label: ECONOMICS IN CHARTS

cadence:
  per_week: 2
  min_days_between: 3

youtube:
  refresh_token_secret: YT_REFRESH_TOKEN_ENGLISH_STORIES   # the channel first made for Slow English now runs Economics in Charts
  category_id: "27"          # Education
  language: en
  privacy: public
  made_for_kids: false
  contains_synthetic_media: false   # Owner chose to leave the AI label unticked for now (17 Oct 2026).
  upload_captions: true

voice:
  backend: chatterbox
  reference: voice/reference.wav
  exaggeration: 0.5
  cfg_weight: 0.5
  tempo: 1.0

render:
  width: 1920
  height: 1080
  fps: 24
  sentence_pause: 0.35
  scene_pause: 0.8
  chart_frames: 36           # frames R draws to reveal each chart
  chart_reveal_seconds: 6
  min_minutes: 3            # the cloned voice reads ~1000 words in about 4-5 minutes
  max_minutes: 20
  accent: "#F2B33D"

script:
  min_words: 600
  max_words: 2200
  min_scenes: 6
  max_scenes: 16
  min_charts: 4

description_footer: |
  Economics in Charts: one question about the economy and your money each week, answered with public data and simple models.
  Narration uses an AI clone of the creator's own voice. Charts are drawn from the data sources listed above.
